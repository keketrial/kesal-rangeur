[package]
name = "kesal-rangeur"
version = "0.1.0"
edition = "2021"
description = "Range automatiquement les téléchargements de médias (films, séries…) avec les titres TMDB dans votre langue"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
regex = "1"
deunicode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
axum = "0.7"
libc = "0.2"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
tempfile = "3"
