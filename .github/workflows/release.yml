name: publication
# Se déclenche en poussant une étiquette « v0.2.0 » (version stable) ou « v0.2.0-beta.1 » (préversion).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# droits minimaux par défaut ; chaque job réclame seulement ce dont il a besoin
permissions:
  contents: read

jobs:
  binaires:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  nom: linux-x86_64,   ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, nom: linux-arm64,    ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     nom: windows-x86_64, ext: ".exe" }
          - { os: macos-latest,     target: x86_64-apple-darwin,        nom: macos-x86_64,   ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,       nom: macos-arm64,    ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Outils musl (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Emballer
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/kesal-rangeur${{ matrix.ext }}" dist/
          cp README.md LICENSE dist/
          cd dist
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a "../kesal-rangeur-${{ github.ref_name }}-${{ matrix.nom }}.zip" . > /dev/null
          else
            tar czf "../kesal-rangeur-${{ github.ref_name }}-${{ matrix.nom }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          path: kesal-rangeur-*

  publication:
    needs: binaires
    runs-on: ubuntu-latest
    permissions:
      contents: write   # créer la publication GitHub
      actions: write    # lancer ensuite la construction de l'image Docker (docker.yml)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd fichiers && sha256sum * > SHA256SUMS.txt
      - name: Notes de version (section du CHANGELOG.md pour cette étiquette)
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Voir le CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: fichiers/*
          body_path: notes.md
          generate_release_notes: false
          # « v1.2.0-beta.1 » est publié comme préversion
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Lancer la publication de l'image Docker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml -R "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
