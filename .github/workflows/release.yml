name: publication
# Se déclenche en poussant une étiquette « v0.2.0 » (version stable) ou « v0.2.0-beta.1 » (préversion).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # créer la publication GitHub
  packages: write   # pousser l'image Docker sur ghcr.io

jobs:
  binaires:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  nom: linux-x86_64,   ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, nom: linux-arm64,    ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     nom: windows-x86_64, ext: ".exe" }
          - { os: macos-latest,     target: x86_64-apple-darwin,        nom: macos-x86_64,   ext: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,       nom: macos-arm64,    ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Outils musl (Linux)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Emballer
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/kesal-rangeur${{ matrix.ext }}" dist/
          cp README.md LICENSE dist/
          cd dist
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a "../kesal-rangeur-${{ github.ref_name }}-${{ matrix.nom }}.zip" . > /dev/null
          else
            tar czf "../kesal-rangeur-${{ github.ref_name }}-${{ matrix.nom }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom }}
          path: kesal-rangeur-*

  publication:
    needs: binaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fichiers
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd fichiers && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: fichiers/*
          generate_release_notes: true
          # « v1.2.0-beta.1 » est publié comme préversion
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
